[package]
name = "ios_backup_extractor"
version = "2.0.0"
edition = "2024"
description = "Extract media files from an unencrypted local iOS device backup"
license = "Artistic-2.0"
repository = "https://github.com/joz-k/ios_backup_extractor"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "5"
plist = "1"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
tempfile = "3"
terminal_size = "0.4"
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[profile.release]
lto = true
strip = true